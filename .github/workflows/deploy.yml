name: Deploy to Scaleway

on:
  push:
    branches:
      - Exo-Eval

jobs:
  build-and-push-backend:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Scaleway CLI
        run: |
          curl -fsSL https://github.com/scaleway/scaleway-cli/releases/download/v2.37.0/scaleway-cli_2.37.0_linux_amd64 -o scw
          chmod +x scw
          sudo mv scw /usr/local/bin/scw

      - name: Log in to Scaleway Container Registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login rg.fr-par.scw.cloud -u _json_key --password-stdin

      - name: Create .env file for backend
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > ./back/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> ./back/.env
          echo "BCRYPT_SALT_ROUNDS=${{ secrets.BCRYPT_SALT_ROUNDS }}" >> ./back/.env
          echo "DEFAULT_ADMIN_PASSWORD=${{ secrets.DEFAULT_ADMIN_PASSWORD }}" >> ./back/.env

      - name: Build and push backend image
        run: |
          docker build -t rg.fr-par.scw.cloud/namespace-zucchiatti-evan/zucchiattievalback:latest ./back
          docker push rg.fr-par.scw.cloud/namespace-zucchiatti-evan/zucchiattievalback:latest

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: build-and-push-backend
    steps:
      - name: Deploy backend container
        run: |
          scw container container update 25ce846e-43ef-45aa-8550-2cc99ce18a8e \
            image=rg.fr-par.scw.cloud/namespace-zucchiatti-evan/zucchiattievalback:latest \
            min-scale=0 max-scale=1 cpu-limit=100 memory-limit=128 \
            port=3000

      - name: Retrieve backend URL
        run: |
          BACKEND_URL=$(scw container container get 25ce846e-43ef-45aa-8550-2cc99ce18a8e -o json | jq -r '.domain_name')
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV

  build-and-push-frontend:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Scaleway Container Registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login rg.fr-par.scw.cloud -u _json_key --password-stdin

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ env.BACKEND_URL }} \
            -t rg.fr-par.scw.cloud/namespace-zucchiatti-evan/zucchiattievalfront:latest ./front
          docker push rg.fr-par.scw.cloud/namespace-zucchiatti-evan/zucchiattievalfront:latest

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build-and-push-frontend
    steps:
      - name: Deploy frontend container
        run: |
          scw container container update 25ce846e-43ef-45aa-8550-2cc99ce18a8e \
            image=rg.fr-par.scw.cloud/namespace-zucchiatti-evan/zucchiattievalfront:latest \
            min-scale=0 max-scale=1 cpu-limit=100 memory-limit=128 \
            port=80 \
            env.VITE_API_URL=${{ env.BACKEND_URL }}

      - name: Verify Deployment
        run: |
          scw container container list
