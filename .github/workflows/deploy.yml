name: Deploy to Scaleway

on:
  push:
    branches:
      - Exo-Eval

jobs:
  build-and-push-backend:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Scaleway CLI
        run: |
          curl -fsSL https://github.com/scaleway/scaleway-cli/releases/download/v2.37.0/scaleway-cli_2.37.0_linux_amd64 -o scw
          chmod +x scw
          sudo mv scw /usr/local/bin/
          echo "/usr/local/bin" >> $GITHUB_PATH # Ajoute au PATH de GitHub Actions


      - name: Debug Scaleway CLI
        run: |
          echo "🔍 Vérification de l'installation de scw..."
          ls -lah /usr/local/bin/ | grep scw || echo "❌ scw introuvable dans /usr/local/bin"
          ls -lah /usr/bin/ | grep scw || echo "❌ scw introuvable dans /usr/bin"
          which scw || echo "❌ which ne trouve pas scw"
          command -v scw || echo "❌ command -v ne trouve pas scw"
          scw version || echo "❌ Impossible d'exécuter scw"
      

      - name: Log in to Scaleway Container Registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login rg.fr-par.scw.cloud -u _json_key --password-stdin

      - name: Create .env file for backend
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > ./back/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> ./back/.env
          echo "BCRYPT_SALT_ROUNDS=${{ secrets.BCRYPT_SALT_ROUNDS }}" >> ./back/.env
          echo "DEFAULT_ADMIN_PASSWORD=${{ secrets.DEFAULT_ADMIN_PASSWORD }}" >> ./back/.env

      - name: Build and push backend image
        run: |
          docker build -t rg.fr-par.scw.cloud/namespace-zucchiatti-evan/zucchiattievalback:latest ./back
          docker push rg.fr-par.scw.cloud/namespace-zucchiatti-evan/zucchiattievalback:latest

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: build-and-push-backend
    steps:

      - name: Install Scaleway CLI (again)
        run: |
          curl -fsSL https://github.com/scaleway/scaleway-cli/releases/download/v2.37.0/scaleway-cli_2.37.0_linux_amd64 -o scw
          chmod +x scw
          sudo mv scw /usr/local/bin/scw
          echo "/usr/local/bin" >> $GITHUB_PATH
          which scw
          scw version

      - name: Log in to Scaleway Container Registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login rg.fr-par.scw.cloud -u _json_key --password-stdin

      - name: Ensure Scaleway CLI config directory exists
        run: |
          mkdir -p /home/runner/.config/scw
          touch /home/runner/.config/scw/config.yaml

      - name: Configure Scaleway CLI authentication
        run: |
          scw config set access-key=${{ secrets.SCW_ACCESS_KEY }}
          scw config set secret-key=${{ secrets.SCW_SECRET_KEY }}
          scw config set default-organization-id=${{ secrets.SCW_ORGANIZATION_ID }}
          scw config set default-project-id=${{ secrets.SCW_PROJECT_ID }}

      - name: Debug Scaleway CLI Configuration
        run: |
          echo "🔍 Vérification de la configuration Scaleway CLI..."
          scw config get

      - name: Verify Existing Containers
        run: |
          echo "🔍 Liste des conteneurs existants..."
          scw container container list -o json | jq '.'

      - name: Deploy backend container
        run: |
          scw container container update 25ce846e-43ef-45aa-8550-2cc99ce18a8e \
            registry-image=rg.fr-par.scw.cloud/namespace-zucchiatti-evan/zucchiattievalback:latest \
            min-scale=0 max-scale=1 cpu-limit=100 memory-limit=128 \
            port=3000

      - name: Retrieve backend URL
        run: |
          BACKEND_URL=$(scw container container get 25ce846e-43ef-45aa-8550-2cc99ce18a8e -o json | jq -r '.domain_name')
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
  
  

  build-and-push-frontend:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Scaleway CLI (again)
        run: |
          curl -fsSL https://github.com/scaleway/scaleway-cli/releases/download/v2.37.0/scaleway-cli_2.37.0_linux_amd64 -o scw
          chmod +x scw
          sudo mv scw /usr/local/bin/scw
          echo "/usr/local/bin" >> $GITHUB_PATH
          which scw
          scw version

      - name: Log in to Scaleway Container Registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login rg.fr-par.scw.cloud -u _json_key --password-stdin

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ env.BACKEND_URL }} \
            -t rg.fr-par.scw.cloud/namespace-zucchiatti-evan/zucchiattievalfront:latest ./front
          docker push rg.fr-par.scw.cloud/namespace-zucchiatti-evan/zucchiattievalfront:latest

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build-and-push-frontend
    steps:

      - name: Install Scaleway CLI (again)
        run: |
          curl -fsSL https://github.com/scaleway/scaleway-cli/releases/download/v2.37.0/scaleway-cli_2.37.0_linux_amd64 -o scw
          chmod +x scw
          sudo mv scw /usr/local/bin/scw
          echo "/usr/local/bin" >> $GITHUB_PATH
          which scw
          scw version

      - name: Log in to Scaleway Container Registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login rg.fr-par.scw.cloud -u _json_key --password-stdin

      - name: Configure Scaleway CLI authentication
        run: |
          scw config set access-key=${{ secrets.SCW_ACCESS_KEY }}
          scw config set secret-key=${{ secrets.SCW_SECRET_KEY }}
          scw config set default-organization-id=${{ secrets.SCW_ORGANIZATION_ID }}
          scw config set default-project-id=${{ secrets.SCW_PROJECT_ID }}

      - name: Deploy frontend container
        run: |
          scw container container update 25ce846e-43ef-45aa-8550-2cc99ce18a8e \
            registry-image=rg.fr-par.scw.cloud/namespace-zucchiatti-evan/zucchiattievalfront:latest \
            min-scale=0 max-scale=1 cpu-limit=100 memory-limit=128 \
            port=80 \
            env.VITE_API_URL=${{ env.BACKEND_URL }}

      - name: Verify Deployment
        run: |
          scw container container list
